<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فنادق سدى الضيافة | SADAA Hospitality</title>
<meta name="description" content="فنادق سدى الضيافة في مكة المكرمة والمدينة المنورة — تصفح الفنادق والغرف وتواصل مع فريق المبيعات.">
<meta name="theme-color" content="#5E4E77">
<meta property="og:title" content="فنادق سدى الضيافة | SADAA Hospitality">
<link rel="icon" href="assets/logos/sadaa-logo.svg">
<link rel="preload" href="assets/fonts/FatimahArabicITF-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/FatimahArabicITF-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/ProximaNova-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script>
/* تطبيق الثيم قبل الرسم لتجنب الوميض */
(function(){try{var t=localStorage.getItem("sadaa-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<style>
/* خطوط الهوية: FatimahArabicITF للعربي، و Proxima Nova للإنجليزي والأرقام اللاتينية */
@font-face{font-family:'ProximaNova';src:url('assets/fonts/ProximaNova-Light.woff') format('woff');font-weight:300;font-style:normal;font-display:swap;unicode-range:U+0000-024F,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:'ProximaNova';src:url('assets/fonts/ProximaNova-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0000-024F,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:'ProximaNova';src:url('assets/fonts/ProximaNova-Semibold.woff') format('woff');font-weight:600;font-style:normal;font-display:swap;unicode-range:U+0000-024F,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:'ProximaNova';src:url('assets/fonts/ProximaNova-Bold.woff') format('woff');font-weight:700;font-style:normal;font-display:swap;unicode-range:U+0000-024F,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:'ProximaNova';src:url('assets/fonts/ProximaNova-Extrabold.woff') format('woff');font-weight:800;font-style:normal;font-display:swap;unicode-range:U+0000-024F,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:'FatimahArabicIT';src:url('assets/fonts/FatimahArabicITF-Light.woff') format('woff');size-adjust:112%;font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'FatimahArabicIT';src:url('assets/fonts/FatimahArabicITF-Regular.woff') format('woff');size-adjust:112%;font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'FatimahArabicIT';src:url('assets/fonts/FatimahArabicITF-Medium.woff') format('woff');size-adjust:112%;font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'FatimahArabicIT';src:url('assets/fonts/FatimahArabicITF-Bold.woff') format('woff');size-adjust:112%;font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'FatimahArabicIT';src:url('assets/fonts/FatimahArabicITF-Black.woff') format('woff');size-adjust:112%;font-weight:900;font-style:normal;font-display:swap}
:root{
  --p:#5E4E77; --p-d:#463a5a; --btn:#5E4E77; --btn-h:#463a5a; --on-btn:#fff;
  --s:#DBD2CA; --bg:#FBF9F7; --surface:#fff; --cream:#F6F2EE; --line:#EAE2DB;
  --ink:#231f2a; --mute:#7a7383; --gold:#B39B72; --hdr:rgba(255,255,255,.88);
  --shadow:0 6px 24px rgba(60,45,80,.08); --r:18px; --wa:#1f9e55;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --p:#B4A6CE; --p-d:#2A2335; --btn:#6B5A88; --btn-h:#7B6A98; --on-btn:#F4F0F7;
  --s:#4A4058; --bg:#18151E; --surface:#221D29; --cream:#2A2432; --line:#363040;
  --ink:#EAE5EE; --mute:#A39BAD; --gold:#C8B48E; --hdr:rgba(24,21,30,.86);
  --shadow:0 6px 24px rgba(0,0,0,.35); --wa:#2a8a52; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'ProximaNova','FatimahArabicIT','Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:76px;transition:background .3s,color .3s}
html[dir=ltr] body{font-family:'ProximaNova','FatimahArabicIT','Cairo',system-ui,sans-serif}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
section,#rooms-sec,#hotels-sec,#lead-sec,#team-sec{scroll-margin-top:84px}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.scrolled{border-bottom-color:var(--line);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.hdr{display:flex;align-items:center;gap:12px;height:72px;transition:height .3s}
header.scrolled .hdr{height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand img{height:40px;width:auto;transition:height .3s}
header.scrolled .brand img{height:34px}
/* الشعار في الوضع الداكن: يُستخدم logoDark إن وُجد، وإلا يُفتّح الشعار تلقائيًا */
html[data-theme="dark"] img.logo-auto{filter:brightness(0) invert(.93)}
.nav{display:flex;align-items:center;gap:4px;margin-inline-start:18px}
.nav-a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink);transition:.2s}
.nav-a:hover,.nav-a[aria-expanded="true"]{background:var(--cream);color:var(--p)}
.nav-a.active{color:var(--p)}
.nav-a .ic{width:16px;height:16px;transition:transform .2s}
.nav-a[aria-expanded="true"] .ic{transform:rotate(180deg)}
.dd{position:relative}
.dd-panel{position:absolute;top:calc(100% + 10px);inset-inline-start:0;width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(30,20,45,.18);padding:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.2s}
.dd-panel.open{opacity:1;visibility:visible;transform:none}
.hl-link{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;transition:.2s}
.hl-link:hover,.hl-link.active{background:var(--cream)}
.hl-link img{width:64px;height:48px;border-radius:10px;object-fit:cover;background:var(--cream)}
.hl-link b{display:block;font-size:14px;line-height:1.4}
.hl-link small{color:var(--mute);font-size:12px}
.actions{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.icon-btn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--p);transition:.2s}
.icon-btn:hover{background:var(--cream)}
.lang-btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;color:var(--p);font-weight:700;font-size:14px}
.lang-btn:hover{background:var(--cream)}
.cta-h{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:14px;transition:.2s}
.cta-h:hover{background:var(--btn-h)}
.menu-btn{display:none}
.sun{display:none}
html[data-theme="dark"] .sun{display:block} html[data-theme="dark"] .moon{display:none}
@media(max-width:900px){.nav,.cta-h,.lang-btn,.theme-desk{display:none}.menu-btn{display:inline-flex}.hdr{height:62px}.brand img{height:34px}}

/* Mobile drawer */
.drawer{position:fixed;inset:0;z-index:80;visibility:hidden}
.drawer.open{visibility:visible}
.drawer .scrim{position:absolute;inset:0;background:rgba(20,14,28,.45);opacity:0;transition:.25s}
.drawer.open .scrim{opacity:1}
.sheet{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(88vw,380px);background:var(--surface);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
html[dir=rtl] .sheet{transform:translateX(-100%)}
.drawer.open .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h img{height:32px}
.sheet-b{padding:12px 12px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.sheet-t{font-size:12px;font-weight:700;color:var(--mute);padding:10px 8px 4px}
.sheet-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;font-weight:700;font-size:15px}
.sheet-row:hover,.sheet-row.active{background:var(--cream);color:var(--p)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--cream);padding:4px;border-radius:12px;margin:0 4px}
.seg button{padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sheet .cta-h{display:flex;justify-content:center;margin:12px 4px 0;height:48px}

/* ===== Hero slider ===== */
.hero{position:relative;height:min(68vh,560px);min-height:380px;border-radius:0 0 28px 28px;overflow:hidden;background:#3a3047}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 7s ease}
.slide.on img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(30,22,42,.88) 0%,rgba(30,22,42,.3) 52%,rgba(30,22,42,.12) 100%);pointer-events:none}
.hero-txt{position:absolute;z-index:2;bottom:56px;inset-inline:0;color:#fff}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:4px 12px;border-radius:999px;margin-bottom:12px;backdrop-filter:blur(6px)}
.kicker .ic{width:14px;height:14px}
.stars-i{display:inline-flex;gap:1px;color:#E2CFA6}
.stars-i svg{width:13px;height:13px;fill:currentColor;stroke:none}
.hero-txt h1{font-size:clamp(26px,5vw,46px);font-weight:800;line-height:1.25;margin-bottom:8px}
.hero-txt .cap{font-size:clamp(15px,2.2vw,19px);opacity:.92;min-height:1.7em;transition:opacity .4s}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:700;font-size:15px;transition:.25s}
.btn-p{background:var(--btn);color:var(--on-btn)}
.btn-p:hover{background:var(--btn-h)}
.btn-l{background:#fff;color:#5E4E77}
.btn-l:hover{background:#DBD2CA}
.btn-o{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.btn-o:hover{background:rgba(255,255,255,.15)}
.dots{position:absolute;z-index:3;bottom:22px;inset-inline:0;display:flex;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.45);transition:.3s}
.dot.on{width:26px;background:#fff}
.arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:.25s}
.arrow:hover{background:#fff;color:#5E4E77}
.arrow .ic{width:22px;height:22px;stroke-width:2}
.arrow.al{left:16px}.arrow.ar{right:16px}
@media(max-width:640px){.arrow{display:none}}

/* ===== Sections ===== */
section{padding:48px 0}
.sec-h{text-align:center;margin-bottom:28px}
.sec-h h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;color:var(--p)}
.sec-h p{color:var(--mute);font-size:14px;margin-top:4px}
.chip-ic{width:44px;height:44px;border-radius:12px;background:var(--cream);color:var(--p);display:inline-flex;align-items:center;justify-content:center}
.chip-ic .ic{width:22px;height:22px}

.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:-40px;position:relative;z-index:5}
.hl-i{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.hl-i b{display:block;font-size:22px;font-weight:800;color:var(--p);line-height:1.3;direction:ltr}
.hl-i b .ic{width:22px;height:22px;stroke-width:2.2}
.hl-i span{font-size:12.5px;color:var(--mute)}

.about{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.about h2{font-size:clamp(20px,3vw,28px);color:var(--p);font-weight:800;margin-bottom:10px;line-height:1.4}
.about p{color:var(--mute);font-size:15.5px;text-align:justify}
.meta{display:flex;flex-direction:column;gap:12px}
.meta-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.meta-card .row{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mute)}
.meta-card .row b{color:var(--ink)}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{text-align:center;background:var(--cream);border-radius:12px;padding:10px 4px}
.rate b{display:block;font-size:20px;color:var(--p);font-weight:800}
.rate span{font-size:11px;color:var(--mute);font-family:'ProximaNova',system-ui,sans-serif}
@media(max-width:860px){.about{grid-template-columns:1fr}}

.hotels{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.hcard{background:var(--surface);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.hcard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(30,20,45,.16)}
.hcard .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--cream)}
.hcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.hcard:hover .ph img{transform:scale(1.05)}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.95);color:#5E4E77;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.hcard .bd{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
.hcard h3{font-size:19px;font-weight:800}
.hcard .tg{font-size:13.5px;color:var(--p);font-weight:600}
.hcard .ad{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:flex-start}
.hcard .ad .ic{width:15px;height:15px;margin-top:3px}
.hcard .ft{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}
.hcard .go{color:var(--p);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.hcard .go .ic{width:16px;height:16px}
.stars-g{display:inline-flex;gap:2px;color:var(--gold)}
.stars-g svg{width:14px;height:14px;fill:currentColor;stroke:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--mute)}
.chip .ic{width:15px;height:15px}
.chip.active{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.room .ph{position:relative;aspect-ratio:4/3;background:var(--cream);overflow:hidden;width:100%}
.room .ph img{width:100%;height:100%;object-fit:cover}
.cnt{position:absolute;bottom:10px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(30,22,42,.72);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;backdrop-filter:blur(4px)}
.cnt .ic{width:15px;height:15px}
.room .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.room h3{font-size:16.5px;font-weight:800;line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--cream);color:var(--p);padding:4px 10px;border-radius:8px}
.tag .ic{width:14px;height:14px}
.room p{font-size:13.5px;color:var(--mute)}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;font-size:12.5px;color:var(--ink);padding-top:12px;border-top:1px solid var(--line)}
.feats span{display:flex;align-items:center;gap:7px}
.feats .ic{width:16px;height:16px;color:var(--p)}
.act{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.act .btn{flex:1;padding:10px;font-size:13.5px}
.btn-s{background:var(--cream);color:var(--p)}
.btn-s:hover{background:var(--s)}
.act .ic{width:17px;height:17px}

/* Facilities */
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fac{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:start;display:flex;flex-direction:column}
.fac .ph{position:relative;aspect-ratio:16/10;background:var(--cream);overflow:hidden;width:100%}
.fac .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
button.fac:hover .ph img{transform:scale(1.04)}
.fac .bd{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fac .bd .chip-ic{width:36px;height:36px;flex:0 0 auto}
.fac .bd .chip-ic .ic{width:19px;height:19px}
.fac h4{font-size:15px;font-weight:800;line-height:1.4}
.fac p{font-size:12.5px;color:var(--mute)}
.fac.noimg{align-items:center;justify-content:center;text-align:center;padding:18px 12px;gap:8px}
.fac.noimg .chip-ic{width:52px;height:52px}
.fac.noimg .chip-ic .ic{width:26px;height:26px}
@media(max-width:640px){.facs{grid-template-columns:1fr 1fr;gap:10px}.fac:not(.noimg) .bd .chip-ic{display:none}.fac .bd{padding:10px 12px}}

/* Sales team */
.team-bg{background:var(--cream);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.av{width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--on-btn);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.mem h4{font-size:16px;font-weight:800}
.mem .rl{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.cts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%}
.ct{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:12px;background:var(--cream);color:var(--p);font-size:11.5px;font-weight:700;transition:.2s}
.ct:hover{background:var(--s)}
.ct svg{width:19px;height:19px}
.qr{width:104px;height:104px;margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:6px;background:#fff}
.qr img{width:100%;height:100%;object-fit:contain}
.qrt{font-size:11px;color:var(--mute);margin-top:4px}
.ph-num{direction:ltr;unicode-bidi:embed;font-size:12px;color:var(--mute);font-family:system-ui,sans-serif;margin-top:8px}

/* Lead form */
.lead{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;background:linear-gradient(135deg,#5E4E77,#3e3350);border-radius:28px;padding:32px;color:#fff;overflow:hidden}
html[data-theme="dark"] .lead{background:linear-gradient(135deg,#3a3049,#241e2d);border:1px solid var(--line)}
.lead .intro h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;line-height:1.35;margin-bottom:10px}
.lead .intro p{opacity:.88;font-size:15px}
.lead .intro ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.lead .intro li{display:flex;align-items:center;gap:10px}
.lead .intro li .ic{width:22px;height:22px;padding:4px;border-radius:50%;background:rgba(255,255,255,.16);stroke-width:2.4}
form{position:relative;background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--mute)}
.f label i{color:#c0392b;font-style:normal}
.f input,.f select,.f textarea{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%;transition:.2s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--p);background:var(--surface)}
.f textarea{min-height:76px;resize:vertical}
.f .err{display:none;font-size:11.5px;color:#d0574a}
.f.bad input,.f.bad select{border-color:#d0574a}
.f.bad .err{display:block}
.phone{display:flex;gap:6px;direction:ltr}
.phone select{width:122px;flex:0 0 auto}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}
.consent{grid-column:1/-1;font-size:12px;color:var(--mute)}
.submit{grid-column:1/-1;padding:14px;font-size:16px}
.submit[disabled]{opacity:.6;cursor:wait}
.done{grid-column:1/-1;text-align:center;padding:24px 8px;display:none}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--cream);color:var(--p);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done .ok .ic{width:30px;height:30px;stroke-width:2.4}
.done h3{color:var(--p);font-size:20px;margin-bottom:6px}
.done p{color:var(--mute);font-size:14px}
.form-msg{grid-column:1/-1;font-size:13px;color:#d0574a;display:none}
@media(max-width:860px){.lead{grid-template-columns:1fr;padding:22px}form{grid-template-columns:1fr;padding:18px}}

footer{padding:28px 0 20px;text-align:center;color:var(--mute);font-size:12.5px}
footer img{height:30px;margin:0 auto 10px;opacity:.8}

.sticky{position:fixed;bottom:0;inset-inline:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.sticky .btn{flex:1;padding:12px 8px;font-size:14.5px}
.btn-s2{border:1.5px solid var(--btn);color:var(--p);background:var(--surface)}
.btn-s2:hover{background:var(--cream)}
.btn-s2 .ic{width:18px;height:18px}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.btn-wa svg{width:18px;height:18px}
@media(min-width:901px){.sticky{display:none}body{padding-bottom:0}}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(14,10,20,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:74vh;border-radius:12px;object-fit:contain;user-select:none}
.lb .t{color:#fff;font-weight:700;margin-top:14px;text-align:center}
.lb .n{color:rgba(255,255,255,.6);font-size:13px;direction:ltr}
.lb .x{position:absolute;top:14px;inset-inline-end:14px;color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
.lb .x .ic{width:24px;height:24px}
.lb .nav-lb{display:flex;gap:12px;margin-top:12px}
.lb .nav-lb button{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#fff;padding:9px 18px;border-radius:12px;font-size:14px}
.lb .nav-lb button:hover{background:#DBD2CA;color:#5E4E77}
.lb .nav-lb .ic{width:18px;height:18px}

.empty{text-align:center;color:var(--mute);padding:40px 0}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== تحسينات التصميم (ui-ux-pro-max): تباين، لمس، عمق، تناسق ===== */
:root{
  --mute:#675F72; /* تباين 4.5:1 على الخلفية الفاتحة */
  --s-soft:#EFE9E3; --ring:rgba(94,78,119,.28);
  --shadow:0 1px 2px rgba(60,45,80,.05),0 8px 28px rgba(60,45,80,.07);
  --shadow-h:0 2px 4px rgba(60,45,80,.06),0 18px 44px rgba(60,45,80,.14);
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="dark"]{
  --mute:#ADA5B8; --s-soft:#2F2838; --ring:rgba(180,166,206,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
  --shadow-h:0 2px 6px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
}
a,button,[role=button],select,label[for]{cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:3px;box-shadow:0 0 0 6px var(--ring)}
::selection{background:var(--s);color:#2b2236}
.nav-a,.icon-btn,.lang-btn,.cta-h,.btn,.chip,.ct,.sheet-row,.hl-link{transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
.btn:active,.cta-h:active,.ct:active,.chip:active{transform:scale(.97)}
.btn-p,.cta-h{box-shadow:0 6px 18px rgba(94,78,119,.22)}
.btn-p:hover,.cta-h:hover{box-shadow:0 10px 24px rgba(94,78,119,.3)}
html[data-theme="dark"] .btn-p,html[data-theme="dark"] .cta-h{box-shadow:none}

/* عناوين الأقسام: خط فاصل بيج رفيع تحت العنوان */
.sec-h{margin-bottom:32px}
.sec-h h2{letter-spacing:-.01em}
.sec-h h2::after{content:"";display:block;width:44px;height:3px;border-radius:3px;margin:12px auto 0;background:linear-gradient(90deg,var(--s),var(--p),var(--s))}
.sec-h p{font-size:15px;max-width:560px;margin-inline:auto;margin-top:10px}
section{padding:56px 0}
@media(max-width:640px){section{padding:40px 0}}

/* الهيرو */
.hero::after{background:linear-gradient(to top,rgba(30,22,42,.9) 0%,rgba(30,22,42,.35) 50%,rgba(30,22,42,.08) 100%)}
.hero-txt h1{letter-spacing:-.01em;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.arrow{width:48px;height:48px}
.dot{min-width:8px;position:relative}
.dot::before{content:"";position:absolute;inset:-10px -4px}

/* البطاقات */
.hl-i{border-radius:20px;padding:18px 12px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.hl-i:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.hcard,.room,.fac,.mem{box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
.hcard:hover,.room:hover,button.fac:hover,.mem:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--s)}
.hcard h3,.room h3{text-wrap:balance}
.hcard .go .ic{transition:transform .25s var(--ease)}
.hcard:hover .go .ic{transform:translateX(-3px)}
html[dir=ltr] .hcard:hover .go .ic{transform:translateX(3px)}
.badge{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tag{background:var(--s-soft)}
.chip{min-height:40px;padding:8px 16px}
.chip:hover:not(.active){border-color:var(--p);color:var(--p)}
.rate{background:var(--s-soft);border:1px solid var(--line)}

/* فريق المبيعات */
.team-bg{background:linear-gradient(180deg,var(--cream),var(--bg))}
.av{width:64px;height:64px;background:linear-gradient(135deg,var(--btn),#7a6895);box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--s)}
.ct{min-height:56px;background:var(--s-soft)}
.qr{box-shadow:inset 0 0 0 1px var(--line)}

/* النموذج */
.lead{position:relative;box-shadow:0 24px 60px rgba(60,45,80,.22)}
.lead::before{content:"";position:absolute;inset-inline-end:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(219,210,202,.22),transparent 70%);pointer-events:none}
.lead>*{position:relative}
form{box-shadow:0 10px 30px rgba(0,0,0,.12)}
.f label{color:var(--ink);opacity:.8}
.f input,.f select,.f textarea{min-height:46px}
.f input:hover,.f select:hover,.f textarea:hover{border-color:var(--s)}
.f input:focus,.f select:focus,.f textarea:focus{box-shadow:0 0 0 4px var(--ring)}
.f .err,.form-msg{color:#B3261E}
html[data-theme="dark"] .f .err,html[data-theme="dark"] .form-msg{color:#F2B8B5}

/* الشريط السفلي ورأس الصفحة */
.sticky{background:var(--hdr);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.dd-panel{box-shadow:var(--shadow-h)}
footer{border-top:1px solid var(--line);margin-top:8px}
</style>
</head>

/* ---------- Hero slider ---------- */
/* الأسهم: السهم الأيسر يشير لليسار والأيمن لليمين.
   في العربية: الأيمن = السابق، الأيسر = التالي. */
function heroHTML(slides, kicker, title, ctaHotel){
  return `<div class="hero" id="hero">
    ${slides.map((s,i)=>`<div class="slide ${i?"":"on"}"><img src="${esc(s.img)}" alt="" ${i?'loading="lazy"':'fetchpriority="high"'} onerror="imgFallback(this)"></div>`).join("")}
    <div class="hero-txt"><div class="wrap">
      <span class="kicker">${kicker}</span>
      <h1>${esc(title)}</h1>
      <div class="cap" id="cap">${esc(L(slides[0]))}</div>
      <div class="hero-cta">
        <a href="#lead-sec" class="btn btn-l">${esc(T("quote"))}</a>
        ${ctaHotel ? `<a href="#rooms-sec" class="btn btn-o">${esc(T("rooms"))}</a>` : `<a href="#hotels-sec" class="btn btn-o">${esc(T("explore"))}</a>`}
      </div>
    </div></div>
    ${slides.length>1?`<button class="arrow al" aria-label="${esc(lang==="ar"?T("next"):T("prev"))}">${ic("chevL")}</button><button class="arrow ar" aria-label="${esc(lang==="ar"?T("prev"):T("next"))}">${ic("chevR")}</button>
    <div class="dots">${slides.map((_,i)=>`<button class="dot ${i?"":"on"}" data-i="${i}" aria-label="${i+1}"></button>`).join("")}</div>`:""}
  </div>`;
}
function startSlider(slides){
  clearInterval(timer);
  const hero = $("#hero"); if(!hero || slides.length<2) return;
  const els = hero.querySelectorAll(".slide"), dots = hero.querySelectorAll(".dot"), cap = $("#cap");
  let i = 0;
  const go = n => {
    i = (n + els.length) % els.length;
    els.forEach((e,k)=>e.classList.toggle("on",k===i));
    dots.forEach((e,k)=>e.classList.toggle("on",k===i));
    cap.style.opacity = 0; setTimeout(()=>{cap.textContent = L(slides[i]); cap.style.opacity = 1;}, 250);
  };
  const auto = () => { clearInterval(timer); timer = setInterval(()=>go(i+1), 5000); };
  const rtl = lang === "ar";
  hero.querySelector(".al").onclick = () => { go(i + (rtl?1:-1)); auto(); };
  hero.querySelector(".ar").onclick = () => { go(i + (rtl?-1:1)); auto(); };
  dots.forEach(d => d.onclick = () => { go(+d.dataset.i); auto(); });
  let x0 = null;
  hero.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  hero.addEventListener("touchend", e => { if(x0===null) return; const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 40){ const fwd = rtl ? dx>0 : dx<0; go(i + (fwd?1:-1)); auto(); } x0 = null; });
  auto();
}

/* ---------- Team ---------- */
function renderTeam(){
  const topic = currentHotel ? L(currentHotel.name) : T("brandName");
  $("#team").innerHTML = SALES_TEAM.map(m => `
    <div class="mem">
      <div class="av">${esc(L(m.name).trim().charAt(0))}</div>
      <h4>${esc(L(m.name))}</h4><div class="rl">${esc(L(m.role))}</div>
      <div class="cts">
        <a class="ct" href="tel:+${m.phone}">${ic("phone")}${esc(T("call"))}</a>
        <a class="ct" href="${waLink(m.phone, T("waMsg")+" "+topic)}" target="_blank" rel="noopener">${WA}${esc(T("wa"))}</a>
        <a class="ct" href="mailto:${m.email}">${ic("mail")}${esc(T("mail"))}</a>
      </div>
      <div class="ph-num">+${m.phone.replace(/^(\d{3})(\d{2})(\d{3})(\d{4})$/,"$1 $2 $3 $4")}</div>
      <a class="qr" href="${esc(m.vcard)}" target="_blank" rel="noopener"><img src="${esc(m.qr)}" alt="QR" loading="lazy"></a>
      <div class="qrt">${esc(T("qrText"))}</div>
    </div>`).join("");
}
function setWA(h){
  renderTeam();
}

/* ---------- Lightbox ---------- */
let lb = { list:[], i:0, title:"" };
function openLB(h, idx){
  const rm = h.rooms[idx];
  lb = { list: roomImages(h, rm), i:0, title: L({ar:rm.ar,en:rm.en}) };
  showLB(); $("#lb").classList.add("open"); document.body.style.overflow = "hidden";
}
function showLB(){ $("#lbImg").src = lb.list[lb.i]; $("#lbT").textContent = lb.titles ? lb.titles[lb.i] : lb.title; $("#lbN").textContent = `${lb.i+1} / ${lb.list.length}`; }
function stepLB(d){ lb.i = (lb.i + d + lb.list.length) % lb.list.length; showLB(); }
function closeLB(){ $("#lb").classList.remove("open"); document.body.style.overflow = ""; }
$("#lbX").onclick = closeLB;
$("#lbP").onclick = () => stepLB(-1);
$("#lbNx").onclick = () => stepLB(1);
$("#lb").onclick = e => { if(e.target.id === "lb") closeLB(); };
document.addEventListener("keydown", e => {
  if(!$("#lb").classList.contains("open")) return;
  if(e.key === "Escape") closeLB();
  if(e.key === "ArrowLeft") stepLB(lang==="ar"?1:-1);
  if(e.key === "ArrowRight") stepLB(lang==="ar"?-1:1);
});
(()=>{ let x0=null; const el=$("#lb");
  el.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
  el.addEventListener("touchend",e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40) stepLB((lang==="ar"?dx>0:dx<0)?1:-1); x0=null; }); })();

/* ---------- Lead form ---------- */
const form = $("#leadForm");
function setBad(name, bad){ const f = form.querySelector(`[name=${name}]`).closest(".f"); f.classList.toggle("bad", bad); return !bad; }
form.addEventListener("submit", async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  if(d.website) return;
  const phoneDigits = (d.phone||"").replace(/\D/g,"");
  let ok = true;
  ok = setBad("name", !d.name.trim()) && ok;
  ok = setBad("phone", phoneDigits.length < 7) && ok;
  ok = setBad("type", !d.type) && ok;
  ok = setBad("email", !!d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) && ok;
  if(!ok){ form.querySelector(".bad input, .bad select")?.focus(); return; }
  const hotel = HOTELS.find(h => h.id === d.hotel);
  const payload = {
    name: d.name.trim(), company: d.company || "", phone: (d.cc==="other"?"":d.cc) + phoneDigits.replace(/^0+/,""),
    email: d.email || "", type: d.type, hotel: hotel ? hotel.name.ar : "جميع الفنادق", notes: d.notes || "",
    page: location.hash || "#/", lang, source: qs.get("src") || qs.get("utm_source") || "QR"
  };
  const btn = form.querySelector(".submit"), msg = $("#formMsg");
  msg.style.display = "none"; btn.disabled = true; btn.textContent = T("sending");
  try{
    if(!SITE_CONFIG.leadsEndpoint) throw new Error("leadsEndpoint not configured");
    await fetch(SITE_CONFIG.leadsEndpoint, { method:"POST", mode:"no-cors", body: new URLSearchParams(payload) });
    form.querySelectorAll(".f,.consent,.submit,.form-msg").forEach(el=>el.style.display="none");
    $("#done").style.display = "block";
  }catch(err){
    console.error(err); msg.textContent = T("sendErr"); msg.style.display = "block";
  }finally{
    btn.disabled = false; btn.textContent = T("send");
  }
});
form.addEventListener("input", e => { const f = e.target.closest(".f"); if(f) f.classList.remove("bad"); });

/* ---------- Router ---------- */
function route(){
  const id = location.hash.replace(/^#\/?/, "");
  if(["lead-sec","rooms-sec","hotels-sec","team-sec","fac-sec"].includes(id)) return;
  const h = live.find(x => x.id === id);
  setDD(false);
  if(h) renderHotel(h); else renderHome();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if(!a) return;
  const href = a.getAttribute("href");
  if(!href.startsWith("#/")){ e.preventDefault(); setDD(false); document.querySelector(href)?.scrollIntoView({behavior:"smooth"}); }
});
addEventListener("hashchange", route);
if(qs.get("h") && !location.hash) location.hash = "#/" + qs.get("h");
hydrateIcons();
applyLogo();
applyStatic();
route();
</script>
</body>
